name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'thaw-app/website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The docs are not in this repo; the type check needs them in place. The numbers the
      # pages quote are committed, so a check does not spend requests refreshing them.
      - run: bun run sync:content
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: bun run lint
      - run: bun run types:check
      - run: bun run test
      # A page can pass all three and still fail to build.
      - run: bunx next build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
